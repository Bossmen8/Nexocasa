    <main id="contenido">
        <h1>Enviar mensaje al anunciante</h1>
        <p>Los campos marcados con un asterisco (*) son obligatorios.</p>

        <form class="conBorde" action="respuesta-enviar-mensaje.html" method="get">

            <fieldset>
                <legend>Tipo de mensaje *</legend>
                <label><input type="radio" name="tipo-mensaje" value="mas-informacion" checked required> Más información</label>
                <label><input type="radio" name="tipo-mensaje" value="solicitar-cita" required> Solicitar una cita</label>
                <label><input type="radio" name="tipo-mensaje" value="comunicar-oferta" required> Comunicar una oferta</label>
            </fieldset>

<p>
                <label for="texto-mensaje">Texto *</label><br>
                <textarea id="texto-mensaje" name="texto-mensaje" rows="6" cols="50" required></textarea>
            </p>

            <p><button type="submit"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i>Enviar mensaje</button></p>

        </form>

    </main>

    <footer>
