<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Nexocasa | Inicio</title>
    <link rel="icon" href="./img/Favicon Nexocasa.png">
</head>


<body>

    <header>
        <p>
            <img src="./img/Logo Nexocasa.png">
            <a href="index.html">Nexocasa</a>
        </p>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="busqueda.html">Buscar</a></li>
                <li><a href="registro.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Enviar mensaje al anunciante</h1>
        <p>Los campos marcados con un asterisco (*) son obligatorios.</p>

        <form action="respuesta-enviar-mensaje.html" method="get">

            <p>Tipo de mensaje *</p>
            <p>
                <input type="radio" id="tipo-info" name="tipo-mensaje" value="mas-informacion" checked required>
                <label for="tipo-info">Más información</label>
            </p>
            <p>
                <input type="radio" id="tipo-cita" name="tipo-mensaje" value="solicitar-cita" required>
                <label for="tipo-cita">Solicitar una cita</label>
            </p>
            <p>
                <input type="radio" id="tipo-oferta" name="tipo-mensaje" value="comunicar-oferta" required>
                <label for="tipo-oferta">Comunicar una oferta</label>
            </p>

            <p>
                <label for="texto-mensaje">Texto *</label><br>
                <textarea id="texto-mensaje" name="texto-mensaje" rows="6" cols="50" required></textarea>
            </p>

            <p><button type="submit">Enviar mensaje</button></p>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Nexocasa</p>
    </footer>

</body>

</html>
