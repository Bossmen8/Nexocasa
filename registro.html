<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Nexocasa | Inicio</title>
    <link rel="icon" href="./img/Favicon Nexocasa.png">
</head>


<body>

       <header>
              <p>
                     <img src="./img/Logo Nexocasa.png">
                     <a href="index.html">Nexocasa</a>
              </p>
              <nav>
                     <ul>
                            <li><a href="index.html">Inicio</a></li>
                            <li><a href="busqueda.html">Buscar</a></li>
                     </ul>
              </nav>
       </header>

       <main>
              <h1>Regístrate como nuevo usuario</h1>

              <form action="index.html" method="get">

                     <p>
                            <label for="usuario">Nombre de usuario</label><br>
                            <input type="text" id="usuario" name="usuario" pattern="[A-Za-z][A-Za-z0-9]{2,14}"
                                   minlength="3" maxlength="15"
                                   title="Solo letras y números, sin empezar por un número. Entre 3 y 15 caracteres."
                                   required>
                     </p>

                     <p>
                            <label for="password">Contraseña</label><br>
                            <input type="password" id="password" name="password"
                                   pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])[A-Za-z0-9_-]{6,15}" minlength="6"
                                   maxlength="15"
                                   title="Entre 6 y 15 caracteres, con letras, números, guion o guion bajo. Al menos una mayúscula, una minúscula y un número."
                                   required>
                     </p>

                     <p>
                            <label for="repetir-password">Repetir contraseña</label><br>
                            <input type="password" id="repetir-password" name="repetir-password"
                                   pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])[A-Za-z0-9_-]{6,15}" minlength="6"
                                   maxlength="15" title="Debe coincidir con la contraseña indicada." required>
                     </p>

                     <p>
                            <label for="email">Dirección de email</label><br>
                            <input type="email" id="email" name="email" maxlength="254"
                                   pattern="[A-Za-z0-9!#$%&amp;'*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&amp;'*+/=?^_`{|}~-]+)*@[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+"
                                   required>
                     </p>

                     <p>Sexo</p>
                     <p>
                            <input type="radio" id="sexo-hombre" name="sexo" value="hombre" required>
                            <label for="sexo-hombre">Hombre</label>
                     </p>
                     <p>
                            <input type="radio" id="sexo-mujer" name="sexo" value="mujer" required>
                            <label for="sexo-mujer">Mujer</label>
                     </p>
                     <p>
                            <input type="radio" id="sexo-otro" name="sexo" value="otro" required>
                            <label for="sexo-otro">Otro</label>
                     </p>

                     <p>
                            <label for="fecha-nacimiento">Fecha de nacimiento</label><br>
                            <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" min="1900-01-01"
                                   max="2008-09-27" required>
                     </p>

                     <p>
                            <label for="ciudad">Ciudad de residencia</label><br>
                            <input type="text" id="ciudad" name="ciudad">
                     </p>

                     <p>
                            <label for="pais">País de residencia</label><br>
                            <select id="pais" name="pais">
                                   <option value="alemania">Alemania</option>
                                   <option value="argentina">Argentina</option>
                                   <option value="belgica">Bélgica</option>
                                   <option value="colombia">Colombia</option>
                                   <option value="espana" selected>España</option>
                                   <option value="francia">Francia</option>
                                   <option value="italia">Italia</option>
                                   <option value="mexico">México</option>
                                   <option value="portugal">Portugal</option>
                                   <option value="reino-unido">Reino Unido</option>
                            </select>
                     </p>

                     <p>
                            <label for="foto">Foto</label><br>
                            <input type="file" id="foto" name="foto">
                     </p>

                     <p><button type="submit">Registrarse</button></p>

              </form>

       </main>

       <footer>
              <p>&copy; 2026 Nexocasa</p>
       </footer>

</body>

</html>
