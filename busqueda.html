<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Nexocasa | Inicio</title>
    <link rel="icon" href="./img/Favicon Nexocasa.png">
</head>


<body>

    <header>
        <p>
            <img src="./img/Logo Nexocasa.png">
            <a href="index.html">Nexocasa</a>
        </p>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="registro.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Buscar inmuebles</h1>

        <form action="resultado-busqueda.html" method="get">

            <p>Tipo de anuncio</p>
            <p>
                <input type="radio" id="anuncio-alquiler" name="tipo-anuncio" value="alquiler">
                <label for="anuncio-alquiler">Alquiler</label>
            </p>
            <p>
                <input type="radio" id="anuncio-venta" name="tipo-anuncio" value="venta">
                <label for="anuncio-venta">Venta</label>
            </p>

            <p>
                <label for="tipo-vivienda">Tipo de vivienda</label><br>
                <select id="tipo-vivienda" name="tipo-vivienda">
                    <option value="">(Cualquiera)</option>
                    <option value="garaje">Garaje</option>
                    <option value="local">Local</option>
                    <option value="obra-nueva">Obra nueva</option>
                    <option value="oficina">Oficina</option>
                    <option value="vivienda">Vivienda</option>
                </select>
            </p>

            <p>
                <label for="ciudad">Ciudad</label><br>
                <input type="text" id="ciudad" name="ciudad">
            </p>

            <p>
                <label for="pais">País</label><br>
                <select id="pais" name="pais">
                    <option value="">(Cualquiera)</option>
                    <option value="alemania">Alemania</option>
                    <option value="argentina">Argentina</option>
                    <option value="belgica">Bélgica</option>
                    <option value="colombia">Colombia</option>
                    <option value="espana" selected>España</option>
                    <option value="francia">Francia</option>
                    <option value="italia">Italia</option>
                    <option value="mexico">México</option>
                    <option value="portugal">Portugal</option>
                    <option value="reino-unido">Reino Unido</option>
                </select>
            </p>

            <p>Precio entre:</p>
            <p>
                <label for="precio-desde">Desde (€)</label>
                <input type="number" id="precio-desde" name="precio-desde" min="0" step="1000">
                <label for="precio-hasta">Hasta (€)</label>
                <input type="number" id="precio-hasta" name="precio-hasta" min="0" step="1000">
            </p>

            <p>Fecha de publicación entre:</p>
            <p>
                <label for="fecha-desde">Desde</label>
                <input type="date" id="fecha-desde" name="fecha-desde">
                <label for="fecha-hasta">Hasta</label>
                <input type="date" id="fecha-hasta" name="fecha-hasta">
            </p>

            <p><button type="submit">Buscar</button></p>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Nexocasa</p>
    </footer>

</body>

</html>
